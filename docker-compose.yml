services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aroman
      POSTGRES_USER: aroman_migrator
      POSTGRES_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aroman_migrator -d aroman"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
  migrate:
    build: .
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql+psycopg://aroman_migrator:${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}@db:5432/aroman
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER}
      SESSION_PEPPER: ${SESSION_PEPPER:?Set SESSION_PEPPER}
    command: ["sh", "-c", "alembic upgrade head && python -m aroman.administration.grant_app_role"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://aroman_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/aroman
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER}
      SESSION_PEPPER: ${SESSION_PEPPER:?Set SESSION_PEPPER}
      SMS_PROVIDER: ${SMS_PROVIDER:-unconfigured}
      FAKE_SMS_ENABLED: ${FAKE_SMS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
