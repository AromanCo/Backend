name: Python CI
on:
  push:
    branches: [feature/foundation-v1, feat/m6-a4b-otp-transaction-safety]
  pull_request:
    branches: [main, develop]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check aroman tests alembic
      - run: mypy aroman
      - run: pytest -q
  otp-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aroman_otp_test
          POSTGRES_USER: aroman_test
          POSTGRES_PASSWORD: disposable_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aroman_test -d aroman_otp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OTP_POSTGRES_REQUIRED: '1'
      OTP_TEST_POSTGRES_URL: postgresql+psycopg://aroman_test:disposable_test_password@localhost:5432/aroman_otp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_otp_postgres.py
