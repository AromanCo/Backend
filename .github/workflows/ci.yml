name: Python CI
on:
  push:
    branches: [feature/foundation-v1]
  pull_request:
    branches: [main, develop]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check aroman tests alembic
      - run: mypy aroman
      - run: pytest -q
